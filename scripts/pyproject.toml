[project]
name = "yolo-tflite-converter"
version = "0.1.0"
description = "YOLO to TensorFlow Lite conversion using ai-edge-torch"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0,<2.7.0",
    "torchvision",
    "ultralytics",
    "tensorflow==2.19.*",
    "ai-edge-torch==0.4.0",
    "numpy",
    "pillow",
    "onnx>=1.12.0,<1.18.0",
    "tf2onnx>=1.8.4",
    "onnx-tf>=1.10.0",
    "onnxruntime>=1.22.1",
    "onnxslim>=0.1.65",
    "onnx2tf>=1.28.2",
    "tf-keras>=2.19.0",
    "sng4onnx>=1.0.4",
    "onnx-graphsurgeon>=0.5.8",
]
